<!--
  Dark newsletter block with email capture.
-->

<!-- ================= NEWSLETTER ================= -->
  <section class="section" style="padding-top: 0;">
    <div class="container">
      <div class="news reveal">
        <div>
          <span class="eyebrow" style="color:#d9b8a8;">Newsletter</span>
          <h2>First look, small runs</h2>
          <p>Drops sell out fast — subscribers get the link 24 hours early plus 10% off the first order.</p>
        </div>
        <div>
          <form class="news__form" id="newsForm">
            <input type="email" placeholder="your@email.com" required aria-label="Email address" />
            <button class="btn btn--sm" type="submit">Join</button>
          </form>
          <small>No spam. Unsubscribe any time.</small>
        </div>
      </div>
    </div>
  </section>
